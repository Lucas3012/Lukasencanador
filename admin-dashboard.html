<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Administração</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 20px; background-color: #f4f4f9; }
    h1 { color: #333; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 10px 15px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 5px; font-weight: bold; }
    .tab-btn.active { background: #007bff; color: white; }
    table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #333; color: white; }
    select { padding: 5px; border-radius: 4px; }
    .btn-delete { background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logout-btn { background: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header-actions">
    <h1>Painel de Chamados</h1>
    <button class="logout-btn" onclick="logout()">Sair</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-status="Pendente" onclick="trocarAba('Pendente')">Pendentes (<span id="count-pendente">0</span>)</button>
    <button class="tab-btn" data-status="Em Andamento" onclick="trocarAba('Em Andamento')">Em Andamento (<span id="count-andamento">0</span>)</button>
    <button class="tab-btn" data-status="Concluído" onclick="trocarAba('Concluído')">Concluídos (<span id="count-concluido">0</span>)</button>
    <button class="tab-btn" data-status="Todos" onclick="trocarAba('Todos')">Todos (<span id="count-todos">0</span>)</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Protocolo/ID</th>
        <th>Nome</th>
        <th>Telefone</th>
        <th>Detalhes</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-pedidos">
      <tr><td colspan="6" style="text-align:center;">A carregar pedidos...</td></tr>
    </tbody>
  </table>

  <script>
    const API_URL = '';
    let todosOsPedidos = [];
    let abaAtual = 'Pendente';

    function getToken() {
      return localStorage.getItem('adminToken') || '';
    }

    if (!getToken()) {
      window.location.href = '/login.html';
    }

    function logout() {
      localStorage.removeItem('adminToken');
      window.location.href = '/login.html';
    }

    async function carregarPedidos() {
      try {
        const res = await fetch(`${API_URL}/api/admin/pedidos`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${getToken()}`
          }
        });

        if (res.status === 401 || res.status === 403) {
          alert('Sessão expirada. Faça login novamente.');
          logout();
          return;
        }

        todosOsPedidos = await res.json();
        renderizarTabela();
        atualizarContadores();
      } catch (err) {
        console.error('Erro ao carregar pedidos:', err);
      }
    }

    async function alterarStatus(id, novoStatus) {
      try {
        const res = await fetch(`${API_URL}/api/admin/pedidos/${id}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${getToken()}`
          },
          body: JSON.stringify({ status: novoStatus })
        });

        if (res.ok) {
          await carregarPedidos();
        } else {
          const erro = await res.json();
          alert(`Erro ao alterar status: ${erro.mensagem || 'Falha na requisição'}`);
        }
      } catch (err) {
        console.error('Erro ao alterar status:', err);
      }
    }

    async function deletarPedido(id) {
      if (!confirm('Deseja realmente eliminar este pedido?')) return;

      try {
        const res = await fetch(`${API_URL}/api/admin/pedidos/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${getToken()}`
          }
        });

        if (res.ok) {
          await carregarPedidos();
        } else {
          alert('Erro ao eliminar pedido.');
        }
      } catch (err) {
        console.error('Erro ao eliminar pedido:', err);
      }
    }

    function trocarAba(status) {
      abaAtual = status;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.status === status) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      renderizarTabela();
    }

    function renderizarTabela() {
      const tbody = document.getElementById('tabela-pedidos');
      tbody.innerHTML = '';

      const pedidosFiltrados = todosOsPedidos.filter(p => {
        if (abaAtual === 'Todos') return true;
        return String(p.status).toLowerCase() === String(abaAtual).toLowerCase();
      });

      if (pedidosFiltrados.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Nenhum pedido encontrado nesta aba.</td></tr>`;
        return;
      }

      pedidosFiltrados.forEach(pedido => {
        const idVal = pedido.id || pedido._id;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${pedido.protocolo || idVal}</td>
          <td>${pedido.nome || 'N/A'}</td>
          <td>${pedido.telefone || 'N/A'}</td>
          <td>${pedido.servico || pedido.detalhes || 'N/A'}</td>
          <td>
            <select onchange="alterarStatus('${idVal}', this.value)">
              <option value="Pendente" ${pedido.status === 'Pendente' ? 'selected' : ''}>Pendente</option>
              <option value="Em Andamento" ${pedido.status === 'Em Andamento' ? 'selected' : ''}>Em Andamento</option>
              <option value="Concluído" ${pedido.status === 'Concluído' ? 'selected' : ''}>Concluído</option>
              <option value="Cancelado" ${pedido.status === 'Cancelado' ? 'selected' : ''}>Cancelado</option>
            </select>
          </td>
          <td>
            <button class="btn-delete" onclick="deletarPedido('${idVal}')">Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function atualizarContadores() {
      const pendentes = todosOsPedidos.filter(p => p.status === 'Pendente').length;
      const emAndamento = todosOsPedidos.filter(p => p.status === 'Em Andamento').length;
      const concluidos = todosOsPedidos.filter(p => p.status === 'Concluído').length;

      document.getElementById('count-pendente').innerText = pendentes;
      document.getElementById('count-andamento').innerText = emAndamento;
      document.getElementById('count-concluido').innerText = concluidos;
      document.getElementById('count-todos').innerText = todosOsPedidos.length;
    }

    document.addEventListener('DOMContentLoaded', carregarPedidos);
  </script>
</body>
</html>
